<style>
.sw{width:100%;font:12px/1.4 var(--font-sans);color:var(--color-text-secondary)}
.sw p{margin:0 0 4px;color:var(--color-text-primary);font-size:13px}
.sw .g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.sw .g.one{grid-template-columns:1fr}
.sw .f{margin:0;cursor:zoom-in;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden}
.sw .g.one .f{cursor:default}
.sw .f img{display:block;width:100%;height:auto;max-height:230px;object-fit:contain}
.sw .g.one .f img,.sw .g.zoom .f img{max-height:520px}
.sw .f figcaption{padding:6px 8px}
.sw .g.zoom{grid-template-columns:1fr}
.sw .g.zoom .f{display:none}
.sw .g.zoom .f.on{display:block;cursor:zoom-out}
.sw .l{margin-top:8px;font-family:var(--font-mono);font-size:11px}
</style>
<div class="sw"><div id="sl"></div><div id="sg" class="g"></div><div id="sk" class="l"></div></div>
<script>
(function(){
var v=window.visualization,s=v&&v.sources&&v.sources.gallery,g=document.getElementById('sg'),l=document.getElementById('sl'),k=document.getElementById('sk');
if(!s||s.error||!s.data){g.textContent='The pictures could not be loaded.';return}
var d=s.data,p=d.pictures||[];
(d.lines||[]).forEach(function(t){var e=document.createElement('p');e.textContent=t;l.appendChild(e)});
(d.links||[]).forEach(function(t){var e=document.createElement('div');e.textContent=t;k.appendChild(e)});
if(p.length===1)g.className='g one';
p.forEach(function(x){
var f=document.createElement('figure');f.className='f';
var i=document.createElement('img');i.alt=x.caption;i.src=x.src;
var c=document.createElement('figcaption');c.textContent=x.caption;
f.appendChild(i);f.appendChild(c);
f.onclick=function(){if(p.length<2)return;var z=g.classList.contains('zoom')&&f.classList.contains('on');
[].forEach.call(g.children,function(n){n.classList.remove('on')});
if(z){g.classList.remove('zoom')}else{g.classList.add('zoom');f.classList.add('on')}};
g.appendChild(f)})})();
</script>
