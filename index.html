<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
      body { display: grid; place-items: center; }

      canvas { display: block; touch-action: none; cursor: none; outline: none; }
      canvas[data-ring='true'] { outline: 2px solid #c4460f; outline-offset: -2px; }
      #fail { color: #e9e4da; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; max-width: 72ch; padding: 32px; }
    </style>
  </head>
  <body>
    <div id="controls"></div>
    <canvas id="stage" tabindex="0"></canvas>
    <pre id="fail" hidden></pre>

  </body>
</html>
